# examples/ のサンプルと部品の見本を GitHub Pages に出す（https://kimuracoki.github.io/nene/）
# 使う前に、リポジトリの Settings → Pages の Source を「GitHub Actions」にしておく
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # .ts をそのまま実行する
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node ../src/cli.ts build --base /nene/ --out ../dist/pages
        working-directory: examples
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - id: deployment
        uses: actions/deploy-pages@v4
